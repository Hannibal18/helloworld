<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>엄마 전쟁</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 입장 화면 -->
      <div id="intro" class="intro">
        <div class="intro-card">
          <h1 class="intro-title">엄마 전쟁</h1>
          <p class="intro-sub">캐릭터를 뽑고 입장하세요</p>
          <div class="char-preview">
            <canvas id="char-preview-canvas" class="char-preview-canvas" width="64" height="64"></canvas>
          </div>
          <button id="reroll" class="reroll-btn" type="button">🎲 다시 뽑기</button>
          <input id="nick" class="nick-input" type="text" maxlength="12" placeholder="닉네임" autocomplete="off" />
          <input id="game-id" class="nick-input game-id-input" type="text" maxlength="8" placeholder="방 코드 (비우면 새 방)" autocomplete="off" />
          <div class="mode-toggle" role="radiogroup" aria-label="게임 모드">
            <button id="mode-pk" type="button" class="mode-btn active" data-mode="pk">⚔️ PK 모드</button>
            <button id="mode-zombie" type="button" class="mode-btn" data-mode="zombie">🧟 좀비 모드</button>
          </div>
          <button id="enter" class="enter-btn">입 장</button>
          <p class="intro-hint">방 코드 같으면 같이 플레이 · 비우면 자동 생성<br/>PC: WASD/방향키 이동 · Space 공격 · 모바일: 조이스틱 + 공격</p>
        </div>
      </div>

      <!-- 게임 화면 -->
      <div id="game" class="game hidden">
        <!-- 백버퍼 + 말풍선 오버레이를 정수배 업스케일된 viewport 박스 안에서 함께 다룬다 -->
        <div id="viewport" class="viewport">
          <canvas id="canvas"></canvas>
          <canvas id="hud-canvas" class="hud-canvas"></canvas>
          <div id="bubbles" class="bubbles-layer"></div>
        </div>

        <!-- 상단 HUD -->
        <div class="hud-top">
          <div class="hud-pill" id="roster">접속자 1</div>
          <div class="hud-pill" id="my-kills">킬 0</div>
        </div>

        <!-- 좌상단 스택: 랭킹 → 채팅 로그 (flex column 으로 자동 정렬) -->
        <div class="left-stack">
          <div id="ranking" class="ranking"></div>
          <div id="chat-log" class="chat-log"></div>
        </div>

        <!-- 미니맵 (우상단) -->
        <canvas id="minimap" class="minimap" width="120" height="80"></canvas>

        <!-- 킬/사망 중앙 배너 -->
        <div id="banner" class="banner"></div>

        <!-- 모바일 가상 컨트롤 -->
        <div id="touch-controls" class="touch-controls hidden">
          <div id="stick" class="stick">
            <div id="stick-knob" class="stick-knob"></div>
          </div>
          <div class="touch-right">
            <button id="btn-mental" class="touch-btn touch-btn-mental">멘탈<br/>공격</button>
            <button id="btn-attack" class="touch-btn touch-btn-attack">공격</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
