<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>게임 선택</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        background: #1a1410;
        color: #f0e6d0;
        font-family: "Galmuri11", "NeoDunggeunmo", monospace;
        overflow: hidden;
        overscroll-behavior: none;
      }
      .landing {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 28px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        background:
          radial-gradient(circle at 50% 30%, #2a1f15 0%, #120c08 70%),
          repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,0.18) 3px 4px);
      }
      .landing h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 8px;
        color: #f7e7b8;
        text-shadow: 2px 2px 0 #1a0e08;
      }
      .landing-sub {
        margin: -16px 0 0;
        color: #c9b58d;
        font-size: 13px;
        letter-spacing: 2px;
      }
      .game-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
        width: min(420px, 90vw);
      }
      @media (min-width: 720px) {
        .game-grid { flex-direction: row; width: min(720px, 92vw); }
      }
      .game-card {
        flex: 1;
        display: block;
        padding: 22px 20px;
        border: 2px solid #6a4a2a;
        background: rgba(40, 28, 18, 0.92);
        box-shadow: 0 0 0 2px #1a0e08, 0 8px 24px rgba(0,0,0,0.55);
        text-decoration: none;
        color: inherit;
        cursor: pointer;
        transition: transform 0.08s ease, border-color 0.12s ease, background 0.12s ease;
        text-align: center;
      }
      .game-card:hover, .game-card:focus {
        border-color: #ffd84a;
        background: rgba(60, 42, 22, 0.95);
        outline: none;
      }
      .game-card:active { transform: translateY(2px); }
      .game-card-icon {
        font-size: 36px;
        margin-bottom: 6px;
        line-height: 1;
      }
      .game-card-title {
        font-size: 22px;
        letter-spacing: 4px;
        color: #ffe080;
        margin: 0 0 4px;
        text-shadow: 2px 2px 0 #1a0e08;
      }
      .game-card-desc {
        font-size: 12px;
        color: #c9b58d;
        line-height: 1.5;
        margin: 0;
      }
      .footer-note {
        font-size: 11px;
        color: #7a6a52;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>
    <main class="landing">
      <h1>게임 선택</h1>
      <p class="landing-sub">함께 놀 게임을 골라봐</p>
      <div class="game-grid">
        <a class="game-card" href="/mom-war.html">
          <div class="game-card-icon">🧟</div>
          <h2 class="game-card-title">엄마 전쟁</h2>
          <p class="game-card-desc">좀비 웨이브 협동전.<br/>친구와 파티 짜고 살아남아라.</p>
        </a>
        <a class="game-card" href="/cops.html">
          <div class="game-card-icon">🚓</div>
          <h2 class="game-card-title">경찰과 도둑</h2>
          <p class="game-card-desc">대기실에서 파티 모집.<br/>술래잡기 (개발 중).</p>
        </a>
      </div>
      <p class="footer-note">PC · 모바일 둘 다 플레이 가능</p>
    </main>
  </body>
</html>
