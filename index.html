<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>엄마 전쟁</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <!-- 입장 화면 -->
      <div id="intro" class="intro">
        <div class="intro-card">
          <h1 class="intro-title">엄마 전쟁</h1>
          <p class="intro-sub">닉네임을 입력하고 입장하세요</p>
          <input id="nick" class="nick-input" type="text" maxlength="12" placeholder="닉네임" autocomplete="off" />
          <button id="enter" class="enter-btn">입 장</button>
          <p class="intro-hint">PC: 방향키/WASD 이동 · Space 공격 · Enter 채팅<br/>모바일: 왼쪽 조이스틱 · 오른쪽 공격/채팅 버튼</p>
        </div>
      </div>

      <!-- 게임 화면 -->
      <div id="game" class="game hidden">
        <!-- 백버퍼 + 말풍선 오버레이를 정수배 업스케일된 viewport 박스 안에서 함께 다룬다 -->
        <div id="viewport" class="viewport">
          <canvas id="canvas"></canvas>
          <div id="bubbles" class="bubbles-layer"></div>
        </div>

        <!-- 상단 HUD -->
        <div class="hud-top">
          <div class="hud-pill" id="roster">접속자 1</div>
          <div class="hud-pill" id="my-kills">킬 0</div>
          <button id="btn-bgm" class="hud-btn" type="button" aria-label="BGM 토글">♪ ON</button>
        </div>

        <!-- 채팅 입력창 (카카오톡 스타일) — contenteditable div 사용:
             1) iOS 의 input/textarea 자동 스크롤 (포커스 시 페이지 튀어오름) 회피
             2) iOS 의 키보드 위 accessory toolbar (이전/다음/완료) 자동 표시 회피
             3) iOS 연락처/비밀번호 autofill 대상 아님 -->
        <div id="chat-bar" class="chat-bar">
          <div id="chat-input" class="chat-input" contenteditable="true" role="textbox"
               aria-label="메시지 입력" data-placeholder="메시지 입력"
               autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="send"></div>
          <button id="chat-send" class="chat-send" type="button" aria-label="전송">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
              <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
            </svg>
          </button>
        </div>

        <!-- 모바일 가상 컨트롤 -->
        <div id="touch-controls" class="touch-controls hidden">
          <div id="stick" class="stick">
            <div id="stick-knob" class="stick-knob"></div>
          </div>
          <div class="touch-right">
            <button id="btn-attack" class="touch-btn touch-btn-attack">공격</button>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
