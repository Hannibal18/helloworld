<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>🎬 컷씬 스튜디오</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css" />
    <link rel="stylesheet" href="/src/studio/style.css" />
  </head>
  <body>
    <header class="st-topbar">
      <div class="st-topbar-left">
        <strong>🎬 컷씬 스튜디오</strong>
        <input id="project-name" class="st-input st-input-title" type="text" value="새 컷씬" />
      </div>
      <div class="st-topbar-right">
        <a class="st-link" href="/">← 게임</a>
        <button id="btn-import" class="st-btn" type="button">📥 Import</button>
        <button id="btn-export" class="st-btn st-btn-primary" type="button">💾 Export</button>
      </div>
    </header>

    <div class="st-body">
      <!-- 좌: 미디어 빈 -->
      <aside class="st-bin">
        <div class="st-bin-tabs">
          <button class="st-tab st-tab-active" data-tab="maps">🗺️ 맵</button>
          <button class="st-tab" data-tab="chars">👤 캐릭터</button>
          <button class="st-tab" data-tab="bgm">🎵 BGM</button>
        </div>
        <div class="st-bin-actions">
          <button id="btn-upload" class="st-btn st-btn-ghost" type="button">📁 업로드</button>
        </div>
        <div id="bin-list" class="st-bin-list"></div>
        <input id="bin-upload-input" type="file" class="hidden" />
      </aside>

      <!-- 중: 프리뷰 + 트랜스포트 -->
      <section class="st-stage">
        <div class="st-scene-tabs" id="scene-tabs"></div>
        <div class="st-preview-wrap">
          <canvas id="stage-canvas"></canvas>
          <div class="st-preview-hud">
            <span id="hud-time">0.00s / 0.00s</span>
            <span id="hud-record" class="st-hud-rec hidden">● REC</span>
          </div>
        </div>
        <div class="st-transport">
          <button id="tp-prev" class="st-btn st-tp" type="button" title="처음으로">⏮</button>
          <button id="tp-play" class="st-btn st-tp st-tp-play" type="button" title="재생/정지 (Space)">⏵</button>
          <button id="tp-rec" class="st-btn st-tp st-tp-rec" type="button" title="녹화 (R)">⏺</button>
          <input id="tp-scrub" class="st-scrub" type="range" min="0" max="1000" value="0" />
          <span id="tp-time" class="st-tp-time">0.00 / 0.00</span>
          <span class="st-tp-spacer"></span>
          <label class="st-tp-zoom" title="카메라 줌">
            🔍 <input id="tp-zoom" type="range" min="50" max="400" value="100" />
            <span id="tp-zoom-val">1.0x</span>
          </label>
          <button id="tp-cam-key" class="st-btn" type="button" title="현재 카메라 상태를 키프레임으로 추가">📍 카메라 키</button>
        </div>
      </section>

      <!-- 우: 속성 패널 -->
      <aside class="st-props">
        <div class="st-props-head">⚙️ 속성</div>
        <div id="props-body" class="st-props-body">
          <p class="st-props-empty">트랙·클립을 선택하면 속성이 여기에 표시됩니다.</p>
        </div>
      </aside>
    </div>

    <!-- 하: 타임라인 -->
    <section class="st-timeline">
      <div class="st-timeline-head">
        <span class="st-timeline-title">⏱ 타임라인</span>
        <button id="btn-add-char" class="st-btn" type="button">➕ 캐릭터 추가</button>
        <button id="btn-add-bubble" class="st-btn" type="button">💬 말풍선 추가</button>
        <button id="btn-add-scene" class="st-btn" type="button">🎞 씬 추가</button>
        <span class="st-flex-spacer"></span>
        <label class="st-tp-zoom">
          ⏱ <input id="tl-zoom" type="range" min="20" max="400" value="100" />
        </label>
      </div>
      <div class="st-timeline-body" id="timeline-body"></div>
    </section>

    <div id="toast" class="st-toast hidden"></div>
    <script type="module" src="/src/studio/main.ts"></script>
  </body>
</html>
